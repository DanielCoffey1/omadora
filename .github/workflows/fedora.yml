name: Fedora integration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fedora.yml'
      - 'tests/fedora-container.sh'
      - 'tests/fedora-config.sh'
      - 'tests/fedora-apps.py'
      - 'tests/fedora-maintenance.py'
      - 'omadora.py'
      - 'apps.json'
      - 'omadora_deploy.py'
      - 'omadora_lifecycle.py'
      - 'tests/fedora-lifecycle.py'
      - 'tests/fedora-legacy.py'
      - 'tests/lifecycle-interrupt.py'
      - 'packages/**'
permissions:
  contents: read
jobs:
  fedora-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run real installer in Fedora 44 container
        run: |
          mkdir -p test-results
          docker run --name omadora-fedora-test \
            -v "$PWD:/src:ro" -v "$PWD/test-results:/results" \
            quay.io/fedora/fedora:44 bash /src/tests/fedora-container.sh
      - name: Save Fedora evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fedora-install-results
          path: test-results/
