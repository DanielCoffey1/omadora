name: Omadora offline ISO
on:
  workflow_dispatch:
    inputs:
      reuse_build:
        description: Optional prior ISO workflow run ID (retest its exact ISO, without rebuilding)
        type: string
        default: ''
      reuse_payload:
        description: Optional prior run ID with a completed system image (rebuild only ISO packaging)
        type: string
        default: ''
      reuse_installer:
        description: Optional prior run ID with a composed Anaconda Web UI runtime
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the image build
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker image prune --all --force
          df -h .
      - name: Start disposable Fedora builder
        if: inputs.reuse_build == ''
        run: |
          mkdir -p iso-results
          docker run -d --name omadora-iso-build --privileged \
            -v "$PWD:/src:ro" -v "$PWD/iso-results:/out" \
            quay.io/fedora/fedora:44 sleep infinity
      - name: Install and configure the offline system
        if: inputs.reuse_build == '' && inputs.reuse_payload == ''
        run: docker exec omadora-iso-build bash /src/iso/build-root.sh
      - name: Pack system image
        id: pack
        if: inputs.reuse_build == '' && inputs.reuse_payload == ''
        run: docker exec omadora-iso-build bash /src/iso/pack.sh
      - name: Save reusable system image
        if: steps.pack.outcome == 'success' && inputs.reuse_build == '' && inputs.reuse_payload == ''
        uses: actions/upload-artifact@v4
        with:
          name: omadora-image-payload
          path: iso-results/payload/
          compression-level: 0
          retention-days: 7
      - name: Download prior system image
        if: inputs.reuse_build == '' && inputs.reuse_payload != ''
        uses: actions/download-artifact@v4
        with:
          name: omadora-image-payload
          path: iso-results/payload
          run-id: ${{ inputs.reuse_payload }}
          github-token: ${{ github.token }}
      - name: Compose Fedora installer with the modern wizard
        id: installer
        if: inputs.reuse_build == '' && inputs.reuse_installer == ''
        run: docker exec omadora-iso-build bash /src/iso/build-installer.sh
      - name: Save reusable installer runtime
        if: steps.installer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: omadora-installer-base
          path: iso-results/installer-base/
          compression-level: 0
          retention-days: 7
      - name: Download prior installer runtime
        if: inputs.reuse_build == '' && inputs.reuse_installer != ''
        uses: actions/download-artifact@v4
        with:
          name: omadora-installer-base
          path: iso-results/installer-base
          run-id: ${{ inputs.reuse_installer }}
          github-token: ${{ github.token }}
      - name: Assemble bootable ISO
        if: inputs.reuse_build == ''
        run: docker exec omadora-iso-build bash /src/iso/make-iso.sh
      - name: Download exact previously built ISO
        if: inputs.reuse_build != ''
        uses: actions/download-artifact@v4
        with:
          name: omadora-offline-iso
          path: iso-results
          run-id: ${{ inputs.reuse_build }}
          github-token: ${{ github.token }}
      - name: Make private test media from the previous ISO
        if: inputs.reuse_build != ''
        run: |
          cd iso-results && sha256sum -c SHA256SUMS && cd ..
          docker run --rm --privileged -v "$PWD/iso-results:/out" quay.io/fedora/fedora:44 bash -c '
            set -eu
            dnf install -y lorax
            mkdir -p /out/test
            mkksiso --cmdline "console=ttyS0,115200 console=tty0 systemd.debug_shell=ttyS0 inst.sshd" /out/Omadora-44-x86_64.iso /out/test/omadora-test.iso
          '
      - name: Save ISO and build evidence
        if: always() && inputs.reuse_build == ''
        uses: actions/upload-artifact@v4
        with:
          name: omadora-offline-iso
          compression-level: 0
          retention-days: 7
          path: |
            iso-results/*.iso
            iso-results/*.txt
            iso-results/*.json
            iso-results/*.log
            iso-results/SHA256SUMS
            iso-results/fedora-CHECKSUM
      - name: Install VM test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-system-gui qemu-utils ovmf xvfb x11-utils libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Install and boot with internet blocked
        run: bash tests/omadora-iso.sh
      - name: Save installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omadora-iso-acceptance
          path: vm-results/
      - name: Clean up builder
        if: always()
        run: docker rm -f omadora-iso-build || true
